/* ----------------------- HELPERS ----------------------- */

const plan = id => byId(DB.plans, id);
const balance = inv => inv.total - inv.paid;

const BADGE = {
  Paid: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20', Active: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20', Approved: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20',
  Pending_Payment: 'bg-amber-50 text-amber-700 ring-amber-600/20', Under_Review: 'bg-amber-50 text-amber-700 ring-amber-600/20', Uploaded: 'bg-sky-50 text-sky-700 ring-sky-600/20', On_Leave: 'bg-amber-50 text-amber-700 ring-amber-600/20',
  Partially_Paid: 'bg-sky-50 text-sky-700 ring-sky-600/20',
  Overdue: 'bg-rose-50 text-rose-700 ring-rose-600/20', Rejected: 'bg-rose-50 text-rose-700 ring-rose-600/20', Suspended: 'bg-rose-50 text-rose-700 ring-rose-600/20',
  Void: 'bg-gray-100 text-gray-500 ring-gray-500/10', Missing: 'bg-gray-100 text-gray-500 ring-gray-500/10', Graduated: 'bg-indigo-50 text-indigo-700 ring-indigo-600/20', Withdrawn: 'bg-gray-100 text-gray-500 ring-gray-500/10',

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 2600);
}
function openModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').classList.replace('hidden','flex'); }
function closeModal() { document.getElementById('modal').classList.replace('flex','hidden'); }

/* ----------------------- BILLING ENGINE ----------------------- */
// Mirrors server/src/services/invoiceGenerator.js — idempotent per month.
function generateMonthlyInvoices() {
  let created = 0;
  for (const s of DB.students) {
    if (s.status !== 'Active') continue;
    if (DB.invoices.some(i => i.studentId === s.id && i.period === MONTH && i.status !== 'Void')) continue;
    const enr = DB.enrollments.filter(e => e.studentId === s.id);
    const p = plan(s.planId);
    const lines = enr.map(e => {
      const c = cls(off(e.offeringId).classId);
      return { type: 'Tuition', desc: `${c.code} ${c.title} — monthly installment`, amount: c.tuition };
    });
    if (p?.adminFee) lines.push({ type: 'Admin_Fee', desc: 'Monthly administrative fee', amount: p.adminFee });
    if (!lines.length) continue;
    const total = lines.reduce((t, l) => t + l.amount, 0);
    DB.invoices.push({
      id: uid(), no: `INV-${MONTH.replace('-','')}-${String(DB.seq.inv++).padStart(4,'0')}`,
      studentId: s.id, period: MONTH, total, paid: 0, status: 'Pending_Payment',
      due: MONTH + '-15', lines, createdAt: TODAY,
    });
    created++;
  }
  save();
  toast(created ? `${created} invoice(s) generated for ${MONTH}` : `All active students already billed for ${MONTH} (idempotent)`);
  go(route);
}

// Mirrors paymentWebhook.controller.js — FIFO allocation + immutable receipt.
function recordPayment(studentId, amount, method) {
  amount = Number(amount);
  if (!amount || amount <= 0) return toast('Enter a valid amount');
  const open = DB.invoices
    .filter(i => i.studentId === studentId && ['Pending_Payment','Partially_Paid','Overdue'].includes(i.status))
    .sort((a, b) => a.due.localeCompare(b.due));
  let remaining = amount; const allocations = [];
  for (const inv of open) {
    if (remaining <= 0) break;
    const applied = Math.min(remaining, balance(inv));
    inv.paid += applied;
    inv.status = inv.paid >= inv.total ? 'Paid' : 'Partially_Paid';
    allocations.push({ invoiceNo: inv.no, amount: applied });
    remaining -= applied;
  }
  const receiptNo = `RCPT-${MONTH.replace('-','')}-${String(DB.seq.rcpt++).padStart(4,'0')}`;
  DB.payments.push({ id: uid(), studentId, amount, method, at: TODAY, receiptNo, allocations });
  save(); closeModal();
  toast(`Payment recorded — receipt ${receiptNo}${remaining > 0 ? ` (credit ${money(remaining)})` : ''}`);
  go(route);
}

function voidInvoice(id) {
  const inv = byId(DB.invoices, id);
  if (inv.status === 'Paid') return toast('Paid invoices cannot be voided (state machine)');
  inv.status = 'Void'; save(); go(route); toast(`${inv.no} voided`);
}

function sweepOverdue() {
  let n = 0;
  for (const i of DB.invoices)
    if (['Pending_Payment','Partially_Paid'].includes(i.status) && i.due < TODAY) { i.status = 'Overdue'; n++; }
  save(); go(route); toast(n ? `${n} invoice(s) marked Overdue` : 'No invoices past due');
}

/* ----------------------- SCHEDULING (double-booking guard) ----------------------- */
// Mirrors the EXCLUDE USING gist constraints in schema.sql.
function slotConflicts(day, start, end, roomId, teacherId, ignoreId) {
  const out = [];
  for (const sl of DB.slots) {
    if (sl.id === ignoreId || sl.day !== day) continue;
    const overlap = start < sl.end && sl.start < end;
    if (!overlap) continue;
    if (sl.roomId === roomId) out.push(`Room ${room(roomId).code} is taken ${sl.start}–${sl.end} (${cls(off(sl.offeringId).classId).code})`);
    if (off(sl.offeringId).teacherId === teacherId) out.push(`${tch(teacherId).name} already teaches ${sl.start}–${sl.end} (${cls(off(sl.offeringId).classId).code})`);
  }
  return out;
}

function addSlotFromForm() {
  const f = id => document.getElementById(id).value;
  const offeringId = f('f_off'), roomId = f('f_room'), day = f('f_day'), start = f('f_start'), end = f('f_end');
  if (!start || !end || end <= start) return toast('Invalid time range');
  const conflicts = slotConflicts(day, start, end, roomId, off(offeringId).teacherId, null);
  if (conflicts.length) {
    document.getElementById('conflictBox').innerHTML =
      `<div class="mt-3 rounded-lg bg-rose-50 p-3 text-xs text-rose-700"><b>⛔ Double-booking blocked (DB constraint):</b><ul class="ml-4 mt-1 list-disc">${conflicts.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
    return;
  }
  DB.slots.push({ id: uid(), offeringId, roomId, day, start, end });
  save(); closeModal(); toast('Slot added — no conflicts'); go(route);
}

/* ----------------------- DOCUMENTS ----------------------- */
function simulateUpload(studentId, category, fileName) {
  const prev = DB.documents.filter(d => d.studentId === studentId && d.category === category);
  DB.documents.push({
    id: uid(), studentId, category, status: 'Uploaded',
    version: prev.length + 1, uploadedAt: TODAY,
    fileName: fileName || `${category.toLowerCase()}_${uid()}.pdf`,
  });
  save(); closeModal(); go(route);
  toast('Uploaded via presigned URL → status: Uploaded (pending review)');
}
function reviewDoc(id, status) { byId(DB.documents, id).status = status; save(); go(route); toast(`Document ${status.replace('_',' ').toLowerCase()}`); }

function docMatrix(studentId) {
  return DB.docCategories.filter(c => c.required || DB.documents.some(d => d.studentId === studentId && d.category === c.code))
    .map(c => {
      const versions = DB.documents.filter(d => d.studentId === studentId && d.category === c.code).sort((a,b) => b.version - a.version);
      return { cat: c, latest: versions[0] || null };
    });
}

/* ----------------------- CHANGE PLAN (SCD-2) ----------------------- */
function changePlan(studentId, newPlanId) {
  const s = stu(studentId);
  if (s.planId === newPlanId) return toast('Already on that plan');
  const cur = s.planHistory.find(h => !h.to);
  if (cur) cur.to = TODAY;
  s.planHistory.push({ planId: newPlanId, from: TODAY, to: null });
  s.planId = newPlanId;
  save(); closeModal(); go(route);
  toast('Plan changed — history preserved, old invoices untouched, next billing cycle uses new plan');
}

/* ---------- DASHBOARD ---------- */
function pageDashboard() {

  const open = DB.invoices.filter(i => ['Pending_Payment','Partially_Paid','Overdue'].includes(i.status));

  const overdue = open.filter(i => i.status === 'Overdue');
  const missingDocs = DB.students.filter(s => s.status === 'Active')
    .flatMap(s => docMatrix(s.id).filter(r => r.cat.required && (!r.latest || r.latest.status === 'Rejected')).map(r => ({ s, r })));
  const collected = DB.payments.reduce((t,p) => t + p.amount, 0);

  return `
  <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
    ${kpi('Active students', active)}
    ${kpi('Outstanding AR', money(outstanding), outstanding ? 'border-amber-200 bg-amber-50' : '')}
    ${kpi('Overdue invoices', overdue.length, overdue.length ? 'border-rose-200 bg-rose-50' : '')}
    ${kpi('Collected (all time)', money(collected))}
  </div>

  <div class="mt-6 grid gap-6 lg:grid-cols-2">
    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="font-semibold">⚠️ Attention required</h3>
      </div>
      <ul class="space-y-2.5 text-sm">
        ${overdue.map(i => `<li class="flex items-center justify-between rounded-lg bg-rose-50/60 px-3 py-2">
          <span><b>${stu(i.studentId).name}</b> — ${i.no} overdue since ${i.due}</span>
          <span class="font-semibold text-rose-600 tabular">${money(balance(i))}</span></li>`).join('')}
        ${missingDocs.map(({s, r}) => `<li class="flex items-center justify-between rounded-lg bg-amber-50/60 px-3 py-2">
          <span><b>${s.name}</b> — ${r.cat.title} ${r.latest ? 'rejected' : 'missing'}</span>${badge(r.latest ? 'Rejected' : 'Missing')}</li>`).join('')}

// Unified profile — mirrors GET /students/:id/profile
function openProfile(id) {
  const s = stu(id);
  const schedule = DB.enrollments.filter(e => e.studentId === id).flatMap(e =>
    DB.slots.filter(sl => sl.offeringId === e.offeringId).map(sl => {
      const o = off(sl.offeringId);
      return { ...sl, class: cls(o.classId), teacher: tch(o.teacherId), room: room(sl.roomId) };
    })).sort((a,b) => 'MonTueWedThuFriSatSun'.indexOf(a.day) - 'MonTueWedThuFriSatSun'.indexOf(b.day) || a.start.localeCompare(b.start));
  const docs = docMatrix(id);
  const invs = DB.invoices.filter(i => i.studentId === id).sort((a,b) => b.period.localeCompare(a.period));
  const history = s.planHistory.map(h => `<li class="flex justify-between"><span>${plan(h.planId).code} v${plan(h.planId).version}</span><span class="text-gray-400">${h.from} → ${h.to || 'current'}</span></li>`).join('');

  openModal(`
  <div class="flex items-start justify-between">
    <div><h2 class="text-lg font-semibold">${s.name}</h2>
    <p class="font-mono text-xs text-gray-400">${s.code} · enrolled ${s.enrolled}</p></div>
    <div class="flex items-center gap-2">${badge(s.status)}
    <button onclick="closeModal()" class="rounded-lg p-1 text-gray-400 hover:bg-gray-100">✕</button></div>
  </div>

  <h3 class="mt-5 text-xs font-semibold uppercase tracking-wide text-gray-400">5-Year Plan (SCD-2 history)</h3>
  <ul class="mt-2 space-y-1 rounded-xl bg-gray-50 p-3 text-sm">${history}</ul>
  ${s.status === 'Active' ? `<button onclick="openChangePlan('${s.id}')" class="mt-2 text-xs font-semibold text-indigo-600 hover:underline">Change curriculum plan →</button>` : ''}

  <h3 class="mt-5 text-xs font-semibold uppercase tracking-wide text-gray-400">Current schedule</h3>
  <ul class="mt-2 space-y-1.5 text-sm">
    ${schedule.map(x => `<li class="flex items-center justify-between rounded-lg border border-gray-100 px-3 py-2">
      <span><b>${x.class.code}</b> ${x.class.title}<br><span class="text-xs text-gray-400">${x.teacher.name} · Room ${x.room.code}</span></span>
      <span class="text-xs font-medium text-gray-600">${x.day} ${x.start}–${x.end}</span></li>`).join('') || '<li class="text-gray-400">No enrollments</li>'}
  </ul>

  <h3 class="mt-5 text-xs font-semibold uppercase tracking-wide text-gray-400">Documents</h3>
  <ul class="mt-2 space-y-1.5 text-sm">
    ${docs.map(r => `<li class="flex items-center justify-between rounded-lg border border-gray-100 px-3 py-2">
      <span>${r.cat.title}${r.latest ? ` <span class="text-xs text-gray-400">v${r.latest.version}</span>` : ''}</span>
      ${badge(r.latest ? r.latest.status : 'Missing')}</li>`).join('')}
  </ul>

  <h3 class="mt-5 text-xs font-semibold uppercase tracking-wide text-gray-400">Billing ledger</h3>
  <ul class="mt-2 space-y-1.5 text-sm">
    ${invs.map(i => `<li class="flex items-center justify-between rounded-lg border border-gray-100 px-3 py-2">
      <span class="font-mono text-xs">${i.no}<br><span class="text-gray-400">${i.period}</span></span>
      <span class="flex items-center gap-2">${badge(i.status)}<b class="tabular">${money(balance(i))}</b></span></li>`).join('') || '<li class="text-gray-400">No invoices</li>'}
  </ul>
  ${s.status === 'Active' ? `<button onclick="openPayModal('${s.id}')" class="mt-4 w-full rounded-xl bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">Record payment</button>` : ''}`);
}

function openChangePlan(sid) {

/* ---------- SCHEDULE ---------- */
function pageSchedule() {
  const days = ['Mon','Tue','Wed','Thu','Fri'];
  const colors = ['bg-indigo-100 text-indigo-800 border-indigo-200','bg-emerald-100 text-emerald-800 border-emerald-200','bg-amber-100 text-amber-800 border-amber-200','bg-sky-100 text-sky-800 border-sky-200','bg-rose-100 text-rose-800 border-rose-200'];
  const colorOf = oid => colors[DB.offerings.findIndex(o => o.id === oid) % colors.length];

  return `
  <div class="mb-4 flex items-center justify-between">
    <p class="text-sm text-gray-500">Weekly matrix · double-booking of teachers & rooms is blocked exactly like the <code class="rounded bg-gray-100 px-1 text-xs">EXCLUDE USING gist</code> constraints.</p>
    <button onclick="openAddSlot()" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">+ Add slot</button>
  </div>
  <div class="grid grid-cols-5 gap-3">
    ${days.map(d => `<div>
      <p class="mb-2 text-center text-xs font-semibold uppercase tracking-wide text-gray-400">${d}</p>
      <div class="space-y-2">
        ${DB.slots.filter(sl => sl.day === d).sort((a,b) => a.start.localeCompare(b.start)).map(sl => {
          const o = off(sl.offeringId), c = cls(o.classId);
          return `<div class="rounded-xl border p-2.5 text-xs ${colorOf(o.id)}">
            <p class="font-bold">${c.code}</p>
            <p>${sl.start}–${sl.end}</p>
            <p class="mt-1 opacity-70">${tch(o.teacherId).name.split(' ')[0]} · ${room(sl.roomId).code}</p>
            <button onclick="removeSlot('${sl.id}')" class="mt-1 font-semibold underline opacity-50 hover:opacity-100">remove</button>
          </div>`;
        }).join('') || '<div class="rounded-xl border border-dashed border-gray-200 p-3 text-center text-xs text-gray-300">—</div>'}
      </div></div>`).join('')}
  </div>

  <h3 class="mt-8 mb-3 font-semibold">👩‍🏫 Teachers</h3>
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    ${DB.teachers.map(t => {
      const hours = DB.slots.filter(sl => off(sl.offeringId).teacherId === t.id)
        .reduce((h, sl) => h + (parseInt(sl.end) - parseInt(sl.start)) + (parseInt(sl.end.slice(3)) - parseInt(sl.start.slice(3)))/60, 0);
      return `<div class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm">
        <div class="flex items-center justify-between"><p class="text-sm font-semibold">${t.name}</p>${badge(t.status)}</div>
        <p class="mt-1 text-xs text-gray-400">${t.specializations.join(' · ')}</p>
        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-gray-100">
          <div class="h-full rounded-full ${hours/t.maxHours > 0.8 ? 'bg-rose-400' : 'bg-indigo-400'}" style="width:${Math.min(100, hours/t.maxHours*100)}%"></div></div>
        <p class="mt-1 text-[11px] text-gray-400">${hours.toFixed(1)}h / ${t.maxHours}h weekly load</p></div>`;
    }).join('')}
  </div>`;
}

function pageDocuments() {
  return `

  ${DB.students.filter(s => s.status !== 'Graduated').map(s => {

      <div class="mb-3 flex items-center justify-between">
        <p class="font-semibold">${s.name} <span class="ml-1 font-mono text-xs font-normal text-gray-400">${s.code}</span></p>
        ${missing ? `<span class="rounded-full bg-rose-50 px-2.5 py-0.5 text-xs font-medium text-rose-600">${missing} required doc(s) outstanding</span>` : '<span class="rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-medium text-emerald-600">Complete</span>'}
      </div>
      <table class="min-w-full text-sm">
        <tbody class="divide-y divide-gray-50">
        ${rows.map(r => `<tr>
          <td class="py-2 pr-3">${r.cat.title}${r.cat.required ? ' <span class="text-rose-400">*</span>' : ''}</td>
          <td class="py-2 pr-3 text-xs text-gray-400">${r.latest ? `${r.latest.fileName} · v${r.latest.version} · ${r.latest.uploadedAt}` : '—'}</td>
          <td class="py-2 pr-3">${badge(r.latest ? r.latest.status : 'Missing')}</td>
          <td class="py-2 text-right">
            ${r.latest && ['Uploaded','Under_Review'].includes(r.latest.status) ? `
              <button onclick="reviewDoc('${r.latest.id}','Approved')" class="rounded-md bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">Approve</button>
              <button onclick="reviewDoc('${r.latest.id}','Rejected')" class="rounded-md bg-rose-50 px-2 py-1 text-xs font-semibold text-rose-700 hover:bg-rose-100">Reject</button>` : ''}
            <button onclick="openUpload('${s.id}','${r.cat.code}')" class="rounded-md border border-gray-200 px-2 py-1 text-xs font-semibold text-gray-600 hover:bg-gray-50">⬆ Upload${r.latest ? ' v' + (r.latest.version + 1) : ''}</button>
          </td></tr>`).join('')}
        </tbody></table></div>`;
  }).join('')}
  </div>`;
}

}

    ${kpi('Outstanding', money(outstanding), outstanding ? 'border-amber-200 bg-amber-50' : '')}

  <div class="mt-5 flex gap-3">

        <th class="px-5 py-3 text-right">Total</th><th class="px-5 py-3 text-right">Paid</th><th class="px-5 py-3 text-right">Balance</th><th class="px-5 py-3 text-right"></th></tr></thead>

        <td class="px-5 py-3 font-mono text-xs">${i.no}</td>
        <td class="px-5 py-3">${stu(i.studentId).name}</td>
        <td class="px-5 py-3 text-gray-500">${i.due}</td>
        <td class="px-5 py-3">${badge(i.status)}</td>

      <tr class="font-bold"><td class="py-2">Balance due</td><td class="py-2 text-right tabular">${money(balance(i))}</td></tr>
    </tbody></table>
  <button onclick="closeModal()" class="mt-4 w-full rounded-xl border border-gray-200 py-2 text-sm font-medium text-gray-500 hover:bg-gray-50">Close</button>`);
}

function openPayModal(sid) {
  const s = stu(sid);
  const open = DB.invoices.filter(i => i.studentId === sid && ['Pending_Payment','Partially_Paid','Overdue'].includes(i.status));
  const total = open.reduce((t,i) => t + balance(i), 0);
  openModal(`
  <h2 class="text-lg font-semibold">Record payment — ${s.name}</h2>
  <p class="mt-1 text-sm text-gray-500">FIFO allocation across ${open.length} open invoice(s) · total due ${money(total)}. Partial amounts → <i>Partially Paid</i>.</p>
  <div class="mt-4 space-y-3 text-sm">
    <label class="block">Amount (THB)<input id="pay_amount" type="number" value="${total}" min="1" class="mt-1 w-full rounded-lg border-gray-200"></label>
    <label class="block">Method<select id="pay_method" class="mt-1 w-full rounded-lg border-gray-200">
      ${['Bank_Transfer','Credit_Card','Debit_Card','PromptPay','Cash'].map(m=>`<option value="${m}">${m.replace('_',' ')}</option>`).join('')}</select></label>
    <div class="flex gap-2">
      <button onclick="recordPayment('${sid}', document.getElementById('pay_amount').value, document.getElementById('pay_method').value)"
        class="flex-1 rounded-xl bg-indigo-600 py-2.5 font-semibold text-white hover:bg-indigo-500">Process payment</button>
      <button onclick="recordPayment('${sid}', Math.round(${total}/2), document.getElementById('pay_method').value)"
        class="rounded-xl border border-gray-200 px-4 py-2.5 text-xs font-semibold text-gray-600 hover:bg-gray-50">Try 50% partial</button>
    </div>
  </div>`);
}

/* ----------------------- ROUTER ----------------------- */
function go(page) {
  route = page;
  document.getElementById('pageTitle').textContent = PAGES.find(p => p.id === page).label.slice(3);
  document.getElementById('nav').innerHTML = PAGES.map(p =>
    `<button onclick="go('${p.id}')" class="block w-full rounded-xl px-3.5 py-2.5 text-left text-sm font-medium transition ${p.id === route ? 'bg-indigo-50 text-indigo-700' : 'text-gray-500 hover:bg-gray-50'}">${p.label}</button>`).join('');
  const m = document.getElementById('mobileNav');
  m.innerHTML = PAGES.map(p => `<option value="${p.id}" ${p.id===route?'selected':''}>${p.label}</option>`).join('');
  document.getElementById('main').innerHTML =
    { dashboard: pageDashboard, students: pageStudents, schedule: pageSchedule, documents: pageDocuments, billing: pageBilling }[page]();
}

document.getElementById('semBadge').textContent = `Semester 1 · ${new Date().getFullYear()}`;
document.getElementById('todayLbl').textContent = new Date().toDateString();
go('dashboard');
</script>
